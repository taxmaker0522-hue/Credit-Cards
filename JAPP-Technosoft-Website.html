  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2), 0 8px 16px -8px rgba(10,31,44,.10);\n\n  /* ---- Radius ---- */\n  --cn-r-sm:       6px;\n  --cn-r-md:       12px;\n  --cn-r-lg:       20px;\n  --cn-r-pill:     999px;\n\n  /* ---- Spacing scale (4px base) ---- */\n  --cn-s-1:  4px;\n  --cn-s-2:  8px;\n  --cn-s-3:  12px;\n  --cn-s-4:  16px;\n  --cn-s-5:  24px;\n  --cn-s-6:  32px;\n  --cn-s-7:  48px;\n  --cn-s-8:  64px;\n  --cn-s-9:  96px;\n  --cn-s-10: 128px;\n\n  /* ---- Type families ---- */\n  --cn-display: \"Instrument Serif\", \"Times New Roman\", Georgia, serif; /* @kind font */\n  --cn-body:    \"Plus Jakarta Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif; /* @kind font */\n  --cn-mono:    \"JetBrains Mono\", \"SF Mono\", Menlo, monospace; /* @kind font */\n\n  /* ---- Type scale (responsive via clamp) ---- */\n  --cn-fs-display:  clamp(48px, 6vw, 92px); /* @kind font */\n  --cn-fs-h1:       clamp(40px, 4.6vw, 64px); /* @kind font */\n  --cn-fs-h2:       clamp(30px, 3vw, 44px); /* @kind font */\n  --cn-fs-h3:       clamp(22px, 1.8vw, 28px); /* @kind font */\n  --cn-fs-h4:       18px; /* @kind font */\n  --cn-fs-lead:     20px; /* @kind font */\n  --cn-fs-body:     16px; /* @kind font */\n  --cn-fs-small:    14px; /* @kind font */\n  --cn-fs-micro:    12px; /* @kind font */\n\n  /* ---- Line heights ---- */\n  --cn-lh-tight:    1.05; /* @kind font */\n  --cn-lh-snug:     1.25; /* @kind font */\n  --cn-lh-body:     1.6; /* @kind font */\n  --cn-lh-loose:    1.75; /* @kind font */\n\n  /* ---- Letterspacing ---- */\n  --cn-ls-tight:   -0.02em; /* @kind font */\n  --cn-ls-eyebrow:  0.18em; /* @kind font */\n}\n\n/* =======================================================================\n   Semantic helpers — drop these on real elements\n   ======================================================================= */\n\n.cn-display {\n  font-family: var(--cn-display);\n  font-weight: 400;\n  font-size: var(--cn-fs-display);\n  line-height: var(--cn-lh-tight);\n  letter-spacing: var(--cn-ls-tight);\n ; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; cursor: pointer; border: none; background: none; }\n\n/* CSS var overrides driven by the tweaks panel */\n:root {\n  --cn-primary: var(--cn-teal-700);\n  --cn-primary-bright: var(--cn-teal-500);\n}\n\n/* ---------- Layout wrappers ---------- */\n.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); }\n.wrap-tight { max-width: 980px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); }\n\n/* ---------- Eyebrow ---------- */\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 12px;\n  font-size: 11px; font-weight: 700;\n  letter-spacing: .18em; text-transform: uppercase;\n  color: var(--cn-primary);\n}\n.eyebrow::before {\n  content: \"\"; width: 24px; height: 1px; background: var(--cn-primary);\n}\n.eyebrow.light { color: var(--cn-teal-300); }\n.eyebrow.light::before { background: var(--cn-teal-300); }\n.eyebrow.sand { color: var(--cn-sand-500); }\n.eyebrow.sand::before { background: var(--cn-sand-500); }\n\n/* ---------- Type helpers ---------- */\nh1, h2, h3, h4, h5 { margin: 0; font-weight: 400; letter-spacing: -0.015em; }\n.display-serif {\n  font-family: var(--cn-display);\n  line-height: 1.0;\n  font-weight: 400;\n  letter-spacing: -0.025em;\n}\n.display-serif em {\n  font-style: italic;\n  color: var(--cn-primary);\n}\n.display-serif em.light { color: var(--cn-teal-300); }\n.display-serif em.sand { color: var(--cn-sand-500); }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 14px 22px;\n  border-radius: 999px;\n  font-family: var(--cn-body);\n  font-weight: 600; font-size: 14px;\n  letter-spacing: -0.005em;\n  transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;\n  border: 1px solid transparent;\n  cursor: pointer;\n  white-space: nowrap;\n}\n.btn-primary { background: var(--cn-primary); color: white; }\n.btn-primary:hover { background: var(--cn-teal-800); transform: translateY(-1px); box-shadow: 0 10px 24px -10px rgba(15,118,110,.5); }\n.btn-bright { background: var(--cn-primary-bright); color: var(--cn-ink); }\n.btn-bright:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -10px rgba(20,184,166,.5); }\n.btn-ghost-dark { background: transparent; color: white; border-color: rgba(255,255,255,.25); }\n.btn-ghost-dark:hover { background: rgba(255,255,255,.08); }\n.btn-outline { background: transparent; color: var(--cn-primary); border-color: var(--cn-primary); }\n.btn-outline:hover { background: var(--cn-teal-50); }\n.btn-sand { background: var(--cn-sand-500); color: white; }\n.btn-sand:hover { background: var(--cn-sand-700); transform: translateY(-1px); }\n.btn-text {\n  background: transparent; padding: 12px 4px; color: var(--cn-primary);\n}\n.btn-text:hover { color: var(--cn-teal-800); }\n.btn .arrow { transition: transform .2s ease; }\n.btn:hover .arrow { transform: translateX(3px); }\n\n/* ---------- Top nav ---------- */\n.topnav {\n  position: sticky; top: 0;\n  z-index: 50;\n  background: rgba(247,246,243,.85);\n  backdrop-filter: blur(12px);\n  -webkit-backdrop-filter: blur(12px);\n  border-bottom: 1px solid transparent;\n  transition: border-color .2s ease, background .2s ease;\n}\n.topnav.scrolled { border-bottom-color: var(--cn-line); }\n.topnav-inner {\n  display: flex; align-items: center; justify-content: space-between;\n  height: 72px;\n}\n.nav-logo {\n  display: flex; align-items: center; gap: 12px;\n  font-family: var(--cn-display);\n  font-size: 24px;\n  color: var(--cn-ink);\n  letter-spacing: -0.01em;\n}\n.nav-mark {\n  width: 36px; height: 36px;\n  border-radius: 10px;\n  background:\n    radial-gradient(circle at 28% 28%, var(--cn-teal-400), var(--cn-primary) 65%);\n  position: relative;\n  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 8px rgba(15,118,110,.25);\n}\n.nav-mark::after {\n  content: \"\"; position: absolute; inset: 8px;\n  border-radius: 50%;\n  border: 1.5px solid rgba(255,255,255,.9);\n  border-top-color: transparent;\n  border-right-color: transparent;\n  transform: rotate(-15deg);\n}\n.nav-mark::before {\n  content: \"\"; position: absolute; top: 9px; right: 9px;\n  width: 4px; height: 4px; border-radius: 50%;\n  background: rgba(255,255,255,.85);\n}\n.nav-links { display: flex; gap: 32px; align-items: center; }\n.nav-links a {\n  font-size: 14px; font-weight: 500; color: var(--cn-ink);\n  transition: color .15s ease;\n  position: relative;\n}\n.nav-links a:hover { color: var(--cn-primary); }\n.nav-links a.active { color: var(--cn-primary); }\n.nav-links a.active::after {\n  content: \"\"; position: absolute;\n  left: 0; right: 0; bottom: -22px; height: 2px;\n  background: var(--cn-primary);\n}\n@media (max-width: 800px) {\n  .nav-links { display: none; }\n}\n\n/* ---------- Generic section head (eyebrow + h2 + intro) ---------- */\n.section-head {\n  display: grid;\n  grid-template-columns: 1fr 1.8fr;\n  gap: clamp(32px, 6vw, 80px);\n  align-items: start;\n  margin-bottom: 64px;\n}\n@media (max-width: 800px) {\n  .section-head { grid-template-columns: 1fr; gap: 16px; }\n}\n.section-head h2 {\n  font-size: clamp(38px, 4.8vw, 64px);\n  line-height: 1.04;\n  max-width: 18ch;\n}\n.section-intro {\n  font-size: clamp(16px, 1.4vw, 19px);\n  line-height: 1.6;\n  color: var(--cn-ink-soft);\n  max-width: 60ch;\n  margin-bottom: 24px;\n}\n.section-intro:last-child { margin-bottom: 0; }\n.section-intro strong { color: var(--cn-ink); font-weight: 600; }\n\n/* ---------- Generic stats strip ---------- */\n.stats {\n  border-top: 1px solid var(--cn-line);\n  border-bottom: 1px solid var(--cn-line);\n  background: var(--cn-bg);\n}\n.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); }\n.stat { padding: 36px clamp(16px, 2vw, 32px); border-right: 1px solid var(--cn-line); }\n.stat:last-child { border-right: none; }\n.stat-num {\n  font-family: var(--cn-display);\n  font-size: clamp(40px, 4.8vw, 64px);\n  line-height: 1;\n  color: var(--cn-ink);\n  font-feature-settings: \"lnum\";\n  margin-bottom: 12px;\n}\n.stat-num em { font-style: italic; color: var(--cn-primary); }\n.stat-lbl { font-size: 13px; line-height: 1.45; color: var(--cn-ink-soft); }\n@media (max-width: 800px) {\n  .stats-grid { grid-template-columns: repeat(2, 1fr); }\n  .stat { border-bottom: 1px solid var(--cn-line); }\n  .stat:nth-child(2) { border-right: none; }\n  .stat:nth-child(3) { border-bottom: none; }\n  .stat:nth-child(4) { border-bottom: none; }\n}\n\n/* ---------- Generic FAQ ---------- */\n.faq-list { max-width: 820px; }\n.faq-item {\n  background: white;\n  border: 1px solid var(--cn-line);\n  border-radius: 14px;\n  margin-bottom: 10px;\n  overflow: hidden;\n  transition: border-color .2s ease;\n}\n.faq-item.open { border-color: var(--cn-primary); }\n.faq-q {\n  width: 100%;\n  text-align: left;\n  padding: 20px 24px;\n  font-family: var(--cn-body);\n  font-size: 16px; font-weight: 600;\n  color: var(--cn-ink);\n  display: flex; justify-content: space-between; align-items: center; gap: 16px;\n  cursor: pointer;\n  transition: color .15s ease;\n}\n.faq-q:hover { color: var(--cn-primary); }\n.faq-toggle {\n  width: 24px; height: 24px;\n  border-radius: 50%;\n  background: var(--cn-teal-50);\n  color: var(--cn-primary);\n  display: grid; place-items: center;\n  flex-shrink: 0;\n  transition: transform .25s ease, background .15s ease;\n}\n.faq-item.open .faq-toggle { transform: rotate(45deg); background: var(--cn-primary); color: white; }\n.faq-a {\n  max-height: 0;\n  overflow: hidden;\n  transition: max-height .3s ease, padding .3s ease;\n  padding: 0 24px;\n}\n.faq-item.open .faq-a {\n  max-height: 600px;\n  padding: 0 24px 22px;\n}\n.faq-a p { margin: 0; font-size: 15px; line-height: 1.65; color: var(--cn-ink-soft); }\n\n/* ---------- WhatsApp sticky ---------- */\n.wa-sticky {\n  position: fixed;\n  bottom: 24px; right: 24px;\n  z-index: 40;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 20px 14px 16px;\n  background: #25D366;\n  color: white;\n  border-radius: 999px;\n  font-weight: 600;\n  font-size: 14px;\n  box-shadow: 0 12px 28px -6px rgba(37,211,102,.5), 0 4px 12px rgba(0,0,0,.1);\n  transition: transform .15s ease, box-shadow .15s ease;\n  opacity: 0;\n  transform: translateY(20px);\n  pointer-events: none;\n}\n.wa-sticky.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }\n.wa-sticky:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -6px rgba(37,211,102,.6); }\n.wa-sticky svg { background: white; color: #25D366; border-radius: 50%; padding: 5px; width: 28px; height: 28px; }\n@media (max-width: 500px) {\n  .wa-sticky { bottom: 16px; right: 16px; padding: 12px 16px 12px 12px; font-size: 13px; }\n  .wa-sticky-label { display: none; }\n}\n\n/* ---------- Site footer ---------- */\nfooter.site-footer {\n  padding: 80px 0 48px;\n  border-top: 1px solid var(--cn-line);\n  background: var(--cn-bg);\n}\n.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; }\n@media (max-width: 800px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }\n@media (max-width: 500px) { .footer-grid { grid-template-columns: 1fr; } }\n.footer-brand .nav-logo { margin-bottom: 16px; }\n.footer-tagline {\n  font-family: var(--cn-display);\n  font-size: 22px;\n  line-height: 1.25;\n  color: var(--cn-ink);\n  margin: 0 0 16px;\n  max-width: 28ch;\n  letter-spacing: -0.015em;\n}\n.footer-tagline em { font-style: italic; color: var(--cn-primary); }\n.footer-grid h5 {\n  font-size: 11px; font-weight: 700; letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--cn-ink-soft);\n  margin: 0 0 16px;\n}\n.footer-grid ul { list-style: none; padding: 0; margin: 0; }\n.footer-grid li { margin-bottom: 10px; }\n.footer-grid a { font-size: 14px; color: var(--cn-ink); transition: color .15s ease; }\n.footer-grid a:hover { color: var(--cn-primary); }\n.footer-bottom {\n  margin-top: 56px; padding-top: 24px;\n  border-top: 1px solid var(--cn-line);\n  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;\n  gap: 16px;\n  font-size: 13px; color: var(--cn-ink-soft);\n}\n.footer-rera {\n  display: inline-flex; align-items: center; gap: 10px;\n  background: white;\n  border: 1px solid var(--cn-line);\n  border-radius: 8px;\n  padding: 8px 12px;\n  font-size: 11px; color: var(--cn-ink-soft);\n}\n.footer-rera strong { color: var(--cn-ink); font-weight: 600; }\n\n/* ---------- Subtle entry motion ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }\n  .reveal.in { opacity: 1; transform: translateY(0); }\n}\n\n/* ---------- CTA dark box (shared) ---------- */\n.cta { padding-top: 0 !important; padding-bottom: clamp(64px, 9vw, 120px); }\n.cta-box {\n  background:\n    radial-gradient(700px 350px at 100% 0%, rgba(20,184,166,.25), transparent 60%),\n    linear-gradient(135deg, var(--cn-primary), var(--cn-ink));\n  color: white;\n  border-radius: 28px;\n  padding: clamp(40px, 6vw, 72px);\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 56px;\n  align-items: center;\n  box-shadow: 0 40px 80px -24px rgba(15,118,110,.35);\n}\n@media (max-width: 900px) { .cta-box { grid-template-columns: 1fr; gap: 36px; padding: 40px 28px; } }\n.cta-left h2 {\n  font-family: var(--cn-display);\n  font-size: clamp(34px, 4.2vw, 56px);\n  line-height: 1.05;\n  color: white;\n  margin: 0 0 20px;\n  max-width: 14ch;\n  letter-spacing: -0.02em;\n}\n.cta-left h2 em { font-style: italic; color: var(--cn-teal-300); }\n.cta-left p { font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.8); margin: 0 0 24px; max-width: 44ch; }\n.cta-trust {\n  display: flex; gap: 24px; flex-wrap: wrap;\n  padding-top: 20px;\n  border-top: 1px solid rgba(255,255,255,.15);\n}\n.cta-trust-item { font-size: 13px; color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 8px; }\n.cta-trust-item svg { color: var(--cn-teal-300); flex-shrink: 0; }\n.cta-form {\n  display: flex; flex-direction: column; gap: 12px;\n  background: rgba(255,255,255,.04);\n  border: 1px solid rgba(255,255,255,.1);\n  border-radius: 20px;\n  padding: 28px;\n  backdrop-filter: blur(8px);\n}\n.cta-form label {\n  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;\n  color: var(--cn-teal-300);\n  margin-bottom: -6px;\n}\n.cta-form input, .cta-form select {\n  width: 100%; padding: 14px 16px;\n  border-radius: 10px;\n  border: 1px solid rgba(255,255,255,.18);\n  background: rgba(255,255,255,.06);\n  color: white;\n  font-family: inherit; font-size: 15px;\n  transition: border-color .15s ease, background .15s ease;\n}\n.cta-form input::placeholder, .cta-form select { color: rgba(255,255,255,.55); }\n.cta-form select option { color: var(--cn-ink); }\n.cta-form input:focus, .cta-form select:focus {\n  outline: none;\n  border-color: var(--cn-teal-300);\n  background: rgba(255,255,255,.1);\n}\n.cta-form button { justify-content: center; margin-top: 6px; }\n.cta-form-disclaimer { font-size: 11px; color: rgba(255,255,255,.5); line-height: 1.4; margin: 4px 0 0; }\n\n/* ---------- CTA no-form (Contact callout) — reusable across all pages ---------- */\n.cta-callout {\n  background:\n    radial-gradient(900px 500px at 80% -20%, rgba(20,184,166,.32), transparent 60%),\n    radial-gradient(700px 400px at 10% 110%, rgba(194,132,90,.16), transparent 70%),\n    linear-gradient(135deg, var(--cn-primary), var(--cn-ink));\n  color: white;\n  border-radius: 28px;\n  padding: clamp(56px, 8vw, 96px) clamp(28px, 5vw, 72px);\n  text-align: center;\n  box-shadow: 0 40px 80px -24px rgba(15,118,110,.4);\n  position: relative;\n  overflow: hidden;\n}\n.cta-callout::before {\n  content: \"\\201C\";\n  position: absolute;\n  top: -32px; left: 28px;\n  font-family: var(--cn-display);\n  font-size: 220px;\n  line-height: 1  pretty;\">“{{ q.text }}”<\u002Fblockquote>\n              <figcaption style=\"margin-top: auto; display: flex; align-items: center; gap: 12px;\">\n                <span style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--cn-sand-200); color: var(--cn-sand-700); display: grid; place-items: center; font-weight: 700;\">{{ q.initial }}<\u002Fspan>\n                <span style=\"display: flex; flex-direction: column; font-size: 14px;\"><strong>{{ q.name }}<\u002Fstrong><span style=\"color: var(--cn-ink-soft);\">{{ q.place }}<\u002Fspan><\u002Fspan>\n              <\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ============ HOW IT WORKS ============ -->\n  <sc-if value=\"{{ isHow }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"How it works\" style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-direction: column; gap: 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 680px;\">\n        <span class=\"cn-eyebrow\">How it works<\u002Fspan>\n        <h1 style=\"margin: 0; font-family: var(--cn-display); font-weight: 400; font-size: var(--cn-fs-h1); line-height: 1.06;\">Four steps, start to settlement.<\u002Fh1>\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: var(--cn-ink-soft);\">Choose a service to see the flow. Every transaction is confirmed by OTP from your card-issuing bank.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 6px; background: #fff; border: 1px solid var(--cn-line); padding: 6px; border-radius: 999px; align-self: flex-start; flex-wrap: wrap;\">\n        <sc-for list=\"{{ flowTabs }}\" as=\"ft\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ ft.go }}\" style=\"border: 0; background: {{ ft.bg }}; color: {{ ft.fg }}; font: 600 14px var(--cn-body); padding: 10px 18px; border-radius: 999px; cursor: pointer;\">{{ ft.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px;\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <li style=\"background: #fff; border: 1px solid var(--cn-line); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--cn-teal-700); color: #fff; display: grid; place-items: center; font-weight: 700;\">{{ st.n }}<\u002Fspan>\n            <span style=\"font-weight: 600; font-size: 18px;\">{{ st.title }}<\u002Fspan>\n            <span style=\"font-size: 15px; line-height: 1.6; color: var(--cn-ink-soft);\">{{ st.body }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <div style=\"background: var(--cn-sand-50); border: 1px solid var(--cn-sand-200); border-radius: 20px; padding: 28px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-size: 13px; color: var(--cn-sand-700); font-weight: 600;\">What you need<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6;\">Credit card, mobile number linked to it, beneficiary account number and IFSC<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-size: 13px; color: var(--cn-sand-700); font-weight: 600;\">KYC<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6;\">PAN and Aadhaar verification, once, before your first transfer<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-size: 13px; color: var(--cn-sand-700); font-weight: 600;\">Receipt<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6;\">UTR / reference number shared on WhatsApp and SMS after settlement<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ PRICING ============ -->\n  <sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Pricing\" style=\"max-width: 1100px; margin: 0 auto; padding: 72px 24px 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 48px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <span class=\"cn-eyebrow\">Pricing<\u002Fspan>\n        <h1 style=\"margin: 0; font-family: var(--cn-display); font-weight: 400; font-size: var(--cn-fs-h1); line-height: 1.06;\">Charges are quoted per transaction.<\u002Fh1>\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: var(--cn-ink-soft); text-wrap: pretty;\">Fees vary with card network, card type and amount. Send us the details and we'll share the exact charge before you pay. No hidden deductions from the amount credited.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; border-top: 1px solid var(--cn-line);\">\n          <sc-for list=\"{{ pricingFactors }}\" as=\"pf\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--cn-line); font-size: 15px;\">\n              <span style=\"font-weight: 600;\">{{ pf.k }}<\u002Fspan><span style=\"color: var(--cn-ink-soft); text-align: right;\">{{ pf.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <form sc-camel-on-submit=\"{{ submitQuote }}\" style=\"background: #fff; border: 1px solid var(--cn-line); border-radius: 24px; box-shadow: var(--cn-shadow-md); padding: 32px; display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-weight: 600; font-size: 20px;\">Get a quote<\u002Fspan>\n          <span style=\"font-size: 14px; color: var(--cn-ink-soft);\">Opens WhatsApp with your details filled in.<\u002Fspan>\n        <\u002Fdiv>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;\">Name\n          <input name=\"name\" required=\"{{ true }}\" style=\"font: 400 15px var(--cn-body); padding: 13px 14px; border: 1px solid var(--cn-line); border-radius: 12px; background: var(--cn-bg);\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;\">Service\n          <sc-raw-select name=\"service\" style=\"font: 400 15px var(--cn-body); padding: 13px 14px; border: 1px solid var(--cn-line); border-radius: 12px; background: var(--cn-bg);\">\n            <option>Credit card bill payment<\u002Foption>\n            <option>Card to bank withdrawal<\u002Foption>\n            <option>Instant bank transfer (IMPS/NEFT)<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;\">Card network\n            <sc-raw-select name=\"network\" style=\"font: 400 15px var(--cn-body); padding: 13px 14px; border: 1px solid var(--cn-line); border-radius: 12px; background: var(--cn-bg);\">\n              <option>Visa<\u002Foption><option>Mastercard<\u002Foption><option>RuPay<\u002Foption><option>Amex<\u002Foption><option>Diners<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;\">Amount (₹)\n            <input name=\"amount\" type=\"number\" min=\"100\" style=\"font: 400 15px var(--cn-body); padding: 13px 14px; border: 1px solid var(--cn-line); border-radius: 12px; background: var(--cn-bg);\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"border: 0; background: var(--cn-teal-700); color: #fff; font: 600 16px var(--cn-body); padding: 15px; border-radius: 999px; cursor: pointer;\" style-hover=\"background: var(--cn-teal-800);\">Send on WhatsApp<\u002Fbutton>\n        <span style=\"font-size: 13px; color: var(--cn-ink-soft); text-align: center;\">Or call <a href=\"{{ telLink }}\">{{ phoneDisplay }}<\u002Fa><\u002Fspan>\n      <\u002Fform>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ FAQ (all pages) ============ -->\n  <section id=\"faq\" data-screen-label=\"FAQ\" style=\"max-width: 860px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-direction: column; gap: 28px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <span class=\"cn-eyebrow\">FAQ<\u002Fspan>\n      <h2 style=\"margin: 0; font-family: var(--cn-display); font-weight: 400; font-size: var(--cn-fs-h2);\">Common questions<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; border-top: 1px solid var(--cn-line);\">\n      <sc-for list=\"{{ faqs }}\" as=\"fq\" hint-placeholder-count=\"6\">\n        <div style=\"border-bottom: 1px solid var(--cn-line);\">\n          <button sc-camel-on-click=\"{{ fq.toggle }}\" style=\"width: 100%; border: 0; background: transparent; padding: 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; font: 600 17px var(--cn-body); color: var(--cn-ink); cursor: pointer;\">\n            <span>{{ fq.q }}<\u002Fspan><span style=\"font-size: 22px; font-weight: 400; color: var(--cn-teal-700);\">{{ fq.icon }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ fq.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 0 0 22px; font-size: 15px; line-height: 1.7; color: var(--cn-ink-soft); max-width: 720px;\">{{ fq.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px 96px;\">\n    <div style=\"background: var(--cn-teal-700); color: #fff; border-radius: 28px; padding: clamp(32px, 5vw, 56px); display: flex; justify-content: space-between; align-items: center; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 560px;\">\n        <h2 style=\"margin: 0; font-family: var(--cn-display); font-weight: 400; font-size: var(--cn-fs-h2); line-height: 1.1; color: #fff;\">Need to pay a bill or send money today?<\u002Fh2>\n        <span style=\"font-size: 16px; color: var(--cn-teal-50);\">Message us with the amount and card type. We reply with charges and next steps.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n        <a href=\"{{ waLink }}\" target=\"_blank\" style=\"background: #fff; color: var(--cn-teal-800); font: 600 16px var(--cn-body); padding: 15px 26px; border-radius: 999px; text-decoration: none; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;\" style-hover=\"background: var(--cn-teal-50); color: var(--cn-teal-900); text-decoration: none;\">Chat on WhatsApp<\u002Fa>\n        <a href=\"{{ telLink }}\" style=\"border: 1px solid rgba(255,255,255,.5); color: #fff; font: 600 16px var(--cn-body); padding: 14px 26px; border-radius: 999px; text-decoration: none; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;\" style-hover=\"background: rgba(255,255,255,.1); color: #fff; text-decoration: none;\">Call us<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"background: var(--cn-ink); color: #cbd5e1;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 36px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <span style=\"color: #fff; font-weight: 700; letter-spacing: .04em;\">JAPP TECHNOSOFT<\u002Fspan>\n          <span style=\"font-size: 14px; line-height: 1.6;\">Credit card bill payments, card-to-bank withdrawals and instant bank transfers.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n          <span style=\"color: #fff; font-weight: 600;\">Services<\u002Fspan>\n          <span>Credit card bill payment<\u002Fspan><span>Card to bank withdrawal<\u002Fspan><span>IMPS / NEFT transfer<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n          <span style=\"color: #fff; font-weight: 600;\">Contact<\u002Fspan>\n          <a href=\"{{ waLink }}\" target=\"_blank\" style=\"color: #cbd5e1;\">WhatsApp {{ phoneDisplay }}<\u002Fa>\n          <a href=\"{{ telLink }}\" style=\"color: #cbd5e1;\">Call {{ phoneDisplay }}<\u002Fa>\n          <span>Mon–Sat, 9:00 am – 9:00 pm<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid rgba(255,255,255,.12); padding-top: 20px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #94a3b8;\">\n        <span>© 2026 JAPP TECHNOSOFT. Card payments are processed through PCI-DSS compliant payment partners. We do not store card numbers or CVV.<\u002Fspan>\n        <span>Terms · Privacy · Refund policy<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;919999999999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;phoneDisplay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+91 99999 99999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact&quot;},&quot;showTestimonials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', flow: 'withdraw', faqOpen: 0 };\n  go(page) { this.setState({ page }); window.scrollTo({ top: 0, behavior: 'smooth' }); }\n  renderVals() {\n    const { page, flow, faqOpen } = this.state;\n    const num = (this.props.whatsappNumber ?? '919999999999').replace(/\\D/g, '');\n    const phoneDisplay = this.props.phoneDisplay ?? '+91 99999 99999';\n    const waLink = `https://wa.me/${num}?text=${encodeURIComponent('Hi JAPP TECHNOSOFT, I want to know the charges for a transaction.')}`;\n    const nav = [['home', 'Home'], ['how', 'How it works'], ['pricing', 'Pricing']];\n    const flows = {\n      bill: { label: 'Credit card bill', steps: [\n        ['Share card details', 'Tell us the card issuer, last 4 digits and the amount due.'],\n        ['Get the charge', 'We confirm the fee and the exact amount you pay.'],\n        ['Pay securely', 'Pay through our secure gateway via UPI, net banking or debit card.'],\n        ['Bill cleared', 'Payment posts to your card account; we share the reference number.']] },\n      withdraw: { label: 'Card to bank', steps: [\n        ['Add beneficiary', 'Account number, IFSC and purpose: rent, education fees or vendor payment.'],\n        ['Pay by credit card', 'Use any Visa, Mastercard, RuPay or Amex card on our PCI-DSS gateway.'],\n        ['Confirm with OTP', 'Your card-issuing bank authorises the transaction.'],\n        ['Money credited', 'Funds are sent to the beneficiary account by IMPS, usually in minutes.']] },\n      imps: { label: 'IMPS / NEFT', steps: [\n        ['Choose mode', 'IMPS for instant 24×7 credit, NEFT for scheduled batches.'],\n        ['Enter account', 'Beneficiary name, account number and IFSC, verified before sending.'],\n        ['Fund the transfer', 'Pay from your card or bank account.'],\n        ['Track it', 'Get the UTR number to track the credit with the receiving bank.']] }\n    };\n    const faqs = [\n      ['Which cards can I use?', 'Credit cards from all major Indian banks on Visa, Mastercard, RuPay, American Express and Diners networks.'],\n      ['How fast does money reach the bank account?', 'IMPS transfers usually credit within a few minutes, 24×7. NEFT follows RBI settlement batches.'],\n      ['What are the charges?', 'Charges depend on the card network, card type and amount. Contact us on WhatsApp or phone and we will quote the exact fee before you pay.'],\n      ['What can card-to-bank transfers be used for?', 'Rent, school and college fees, and payments to vendors or suppliers. The purpose is recorded with each transaction.'],\n      ['Is my card information safe?', 'Payments go through PCI-DSS compliant payment partners and every transaction is authorised by OTP from your bank. We never store your card number or CVV.'],\n      ['What if a transfer fails?', 'If the beneficiary bank rejects the credit, the amount is refunded to your card. Our team follows up with the reference number.']\n    ];\n    return {\n      waLink, telLink: `tel:+${num}`, phoneDisplay,\n      isHome: page === 'home', isHow: page === 'how', isPricing: page === 'pricing',\n      goHome: () => this.go('home'), goHow: () => this.go('how'),\n      showTestimonials: this.props.showTestimonials ?? true,\n      navItems: nav.map(([k, label]) => ({ label, bg: page === k ? 'var(--cn-teal-100)' : 'transparent', go: () => this.go(k) })),\n      banks: ['HDFC Bank', 'ICICI Bank', 'SBI Card', 'Axis Bank', 'Kotak', 'IndusInd', 'Yes Bank', 'AU Bank', 'IDFC First', 'RBL Bank'],\n      networks: ['VISA', 'MASTERCARD', 'RUPAY', 'AMEX', 'DINERS'],\n      services: [\n        { num: '01', title: 'Credit card bill payment', body: 'Pay the outstanding on any bank’s credit card before the due date and avoid late fees. Payment is posted to your card account with a reference number.', tags: ['All banks', 'Same-day posting'] },\n        { num: '02', title: 'Card to bank withdrawal', body: 'Use your credit card to pay rent, education fees or vendors. The amount is credited directly to the recipient’s bank account.', tags: ['Rent', 'Education', 'Travel', 'Insurance'] },\n        { num: '03', title: 'Instant bank transfer', body: 'Send money to any bank account in India over IMPS, available 24×7, or NEFT for regular transfers.', tags: ['IMPS', 'NEFT', '24×7'] }\n      ],\n      features: [\n        { title: 'Instant settlement', body: 'IMPS credit to the beneficiary account in minutes.' },\n        { title: 'Every bank card', body: 'Visa, Mastercard, RuPay, Amex and Diners cards accepted.' },\n        { title: 'PCI-DSS security', body: 'OTP-authorised payments; card data is never stored.' },\n        { title: 'Reference on every transaction', body: 'UTR and receipt shared on WhatsApp and SMS.' },\n        { title: 'Earn card rewards', body: 'Card spends may earn reward points as per your bank’s terms.' },\n        { title: 'Human support', body: 'Talk to a person on WhatsApp or phone, Mon–Sat.' }\n      ],\n      testimonials: [\n        { text: 'Paid three months of rent on my card and the landlord got it in his account in under ten minutes.', name: 'Customer name', place: 'City', initial: 'A' },\n        { text: 'They told me the charge upfront on WhatsApp. No surprises when the money was credited.', name: 'Customer name', place: 'City', initial: 'B' },\n        { text: 'Used it for my son’s college fee. Got the UTR number right away for the college office.', name: 'Customer name', place: 'City', initial: 'C' }\n      ],\n      flowTabs: Object.entries(flows).map(([k, f]) => ({ label: f.label, bg: flow === k ? 'var(--cn-ink)' : 'transparent', fg: flow === k ? '#fff' : 'var(--cn-ink)', go: () => this.setState({ flow: k }) })),\n      steps: flows[flow].steps.map(([title, body], i) => ({ n: i + 1, title, body })),\n      pricingFactors: [\n        { k: 'Credit card bill payment', v: 'On request' },\n        { k: 'Card to bank withdrawal', v: 'On request' },\n        { k: 'IMPS / NEFT transfer', v: 'On request' },\n        { k: 'Charge depends on', v: 'Network, card type, amount' }\n      ],\n      submitQuote: (e) => {\n        e.preventDefault();\n        const d = new FormData(e.target);\n        const msg = `Hi JAPP TECHNOSOFT, I'm ${d.get('name')}. I need a quote for ${d.get('service')} using a ${d.get('network')} card${d.get('amount') ? ` for ₹${d.get('amount')}` : ''}.`;\n        window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');\n      },\n      faqs: faqs.map(([q, a], i) => ({ q, a, open: faqOpen === i, icon: faqOpen === i ? '−' : '+', toggle: () => this.setState({ faqOpen: faqOpen === i ? -1 : i }) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
